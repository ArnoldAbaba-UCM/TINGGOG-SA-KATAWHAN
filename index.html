<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Tingog sa Katawhan – Theatre Soundboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #0f0f1a 100%);
            font-family: 'Segoe UI', system-ui, 'Inter', sans-serif;
            padding: 1.5rem;
            min-height: 100vh;
        }
        .soundboard {
            max-width: 1600px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
            background: rgba(0,0,0,0.4);
            padding: 1rem 1.5rem;
            border-radius: 3rem;
            backdrop-filter: blur(8px);
        }
        h1 {
            color: #f0e6d0;
            font-size: 1.6rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .scene-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }
        .scene-btn {
            background: #2c2f36;
            border: none;
            color: #ddd;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .scene-btn.active {
            background: #e25822;
            color: white;
            box-shadow: 0 0 8px rgba(226,88,34,0.5);
        }
        .global-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            background: #1e1e2a;
            padding: 0.4rem 1rem;
            border-radius: 3rem;
        }
        .global-controls label {
            color: #ccc;
            font-size: 0.8rem;
        }
        input[type="range"] {
            width: 120px;
            cursor: pointer;
            background: #3a3a44;
            height: 4px;
            border-radius: 5px;
        }
        .stop-all {
            background: #a52222;
            border: none;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
        }
        .sound-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.2rem;
            margin-top: 1.5rem;
        }
        .sound-card {
            background: rgba(30, 30, 40, 0.9);
            backdrop-filter: blur(4px);
            border-radius: 1.5rem;
            padding: 1rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .sound-card:hover {
            transform: translateY(-3px);
            background: rgba(45, 45, 58, 0.95);
        }
        .sound-name {
            font-weight: bold;
            color: #ffecb3;
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
            word-break: break-word;
            text-align: center;
        }
        .button-row {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 0.8rem;
        }
        .btn {
            border: none;
            padding: 0.4rem 0.9rem;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
            font-size: 0.8rem;
        }
        .btn-play { background: #2e7d32; color: white; }
        .btn-stop { background: #b91c1c; color: white; }
        .btn-fade { background: #ff9800; color: #1e1e2a; }
        .volume-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin: 0.6rem 0;
        }
        .volume-row span {
            font-size: 0.7rem;
            color: #aaa;
            width: 35px;
        }
        .volume-slider {
            flex: 1;
            height: 3px;
        }
        .fade-row {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            margin-top: 0.4rem;
        }
        .status-text {
            font-size: 0.7rem;
            text-align: center;
            color: #aaa;
            margin-top: 0.4rem;
        }
        @media (max-width: 700px) {
            body { padding: 1rem; }
            .sound-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: stretch; }
            .global-controls { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="soundboard">
    <div class="header">
        <h1>🎭 TINGOG SA KATAWHAN · SOUNDBOARD</h1>
        <div class="scene-tabs" id="sceneTabs"></div>
        <div class="global-controls">
            <label>🔊 Master</label>
            <input type="range" id="masterVolume" min="0" max="1" step="0.01" value="0.8">
            <button id="globalStopBtn" class="stop-all">⏹️ STOP ALL</button>
        </div>
    </div>
    <div id="soundGrid" class="sound-grid">
        <div style="grid-column:1/-1; text-align:center; color:#aaa;">Loading sounds...</div>
    </div>
</div>

<script>

        },

            sounds: [

                { name: "Behind Closed Doors", file: "SCENE 3 – MAYOR’S OFFICE/Behind Closed Doors.mp3" },

                { name: "The Dark Night (Suspense)", file: "SCENE 3 – MAYOR’S OFFICE/The Dark Night (Suspense Background Music  Suspenseful background music).mp3" },

            ]
        },
        {

            sounds: [
                { name: "Tribal Drums (Alec Koff)", file: "SCENE 5 – PREPARATION FOR THE RALLY/Alec Koff - Cinematic Tribal Drums Background Music for Youtube Videos.mp3" },
                { name: "Before the Streets Awaken (v2)", file: "SCENE 5 – PREPARATION FOR THE RALLY/Before the Streets Awaken (Version 2.0).mp3" },
                { name: "Before the Streets Awaken", file: "SCENE 5 – PREPARATION FOR THE RALLY/Before the Streets Awaken.mp3" },
                { name: "Heartbeat Bass", file: "SCENE 5 – PREPARATION FOR THE RALLY/Sound Effects/Heartbeat Bass Sound Effect.mp3" },
                { name: "Marker Writing", file: "SCENE 5 – PREPARATION FOR THE RALLY/Sound Effects/Realistic Marker Writing Sound Effect.mp3" }
            ]
        },
        {
            name: "📣 SCENE 6 – THE RALLY",
            sounds: [
                // Duplicated Epic Trailer Music added here
                { name: "Epic and Dramatic Trailer Music", file: "SCENE 6 – THE RALLY/Epic and Dramatic Trailer Music.mp3" },
                { name: "Kumilos (dwta feat. Higit)", file: "SCENE 6 – THE RALLY/dwta feat. Higit Sa Pagibig, the Musical - Kumilos (Official Lyric Video).mp3" },
                { name: "One Voice Silenced (v2)", file: "SCENE 6 – THE RALLY/One Voice Silenced (Version 2.0).mp3" },
                { name: "One Voice Silenced", file: "SCENE 6 – THE RALLY/One Voice Silenced.mp3" },
                { name: "Powerful Epic Drum Music", file: "SCENE 6 – THE RALLY/Powerful Epic Drum Music no copyright music by Musicology.mp3" },
                { name: "Tingog sa Katawhan (v2)", file: "SCENE 6 – THE RALLY/Tingog sa Katawhan (Version 2.0).mp3" },
                { name: "Tingog sa Katawhan", file: "SCENE 6 – THE RALLY/Tingog sa Katawhan.mp3" },
                { name: "Active Protest Rally", file: "SCENE 6 – THE RALLY/Sound Effects/Active Protest Rally Audio FREE  Intense Active Protest Rally Ambiences Cinematic Ambience.mp3" },
                { name: "Angry Group Riot", file: "SCENE 6 – THE RALLY/Sound Effects/Angry Group Riot (Shouting  Chanting) - Protest sound effect.mp3" },
                { name: "Crowd screaming", file: "SCENE 6 – THE RALLY/Sound Effects/Crowd screaming sound effect.mp3" },
                { name: "Desert Eagle Gunshot", file: "SCENE 6 – THE RALLY/Sound Effects/Desert Eagle Single Shot Gunshot Sound Effect.mp3" },
                { name: "Police Siren", file: "SCENE 6 – THE RALLY/Sound Effects/Police Siren Sound Effect.mp3" },
                { name: "Shotgun", file: "SCENE 6 – THE RALLY/Sound Effects/Shotgun Sound Effect.mp3" },
                { name: "Wind Sound", file: "SCENE 6 – THE RALLY/Sound Effects/Wind Sound SOUND EFFECT - No Copyright[Download Free].mp3" }
            ]
        }
    ];

    // =======================  WEB AUDIO ENGINE (DO NOT EDIT) =======================
    let audioCtx = null;
    let masterGain = null;
    const soundResources = new Map();
    let currentSceneIdx = 0;

    function initAudio() {
        if (audioCtx && audioCtx.state !== 'closed') return audioCtx;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = parseFloat(document.getElementById('masterVolume').value);
        masterGain.connect(audioCtx.destination);
        return audioCtx;
    }

    async function loadSound(filePath) {
        if (soundResources.has(filePath) && soundResources.get(filePath).buffer) {
            return soundResources.get(filePath).buffer;
        }
        const ctx = initAudio();
        try {
            const response = await fetch(filePath);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const arrayBuffer = await response.arrayBuffer();
            const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
            const gainNode = ctx.createGain();
            gainNode.gain.value = 0.7;
            gainNode.connect(masterGain);
            soundResources.set(filePath, {
                buffer: audioBuffer,
                gainNode: gainNode,
                activeSources: []
            });
            return audioBuffer;
        } catch (err) {
            console.error(`Failed to load ${filePath}:`, err);
            throw err;
        }
    }

    async function playSound(filePath, fadeInSec = 0) {
        const ctx = initAudio();
        if (ctx.state === 'suspended') await ctx.resume();
        let res = soundResources.get(filePath);
        if (!res || !res.buffer) {
            try { await loadSound(filePath); } catch(e) { return; }
            res = soundResources.get(filePath);
        }
        if (!res || !res.buffer) return;
        const gainNode = res.gainNode;
        const source = ctx.createBufferSource();
        source.buffer = res.buffer;
        source.connect(gainNode);
        source.start();
        res.activeSources.push(source);
        source.onended = () => {
            const idx = res.activeSources.indexOf(source);
            if (idx !== -1) res.activeSources.splice(idx, 1);
        };
        if (fadeInSec > 0) {
            const originalGain = gainNode.gain.value;
            gainNode.gain.setValueAtTime(0, ctx.currentTime);
            gainNode.gain.linearRampToValueAtTime(originalGain, ctx.currentTime + fadeInSec);
        }
        return source;
    }

    async function stopSound(filePath, fadeOutSec = 0) {
        const sound = soundResources.get(filePath);
        if (!sound) return;
        const ctx = initAudio();
        const gainNode = sound.gainNode;
        const activeSources = [...sound.activeSources];
        if (fadeOutSec > 0 && ctx.state === 'running') {
            const currentGain = gainNode.gain.value;
            gainNode.gain.setValueAtTime(currentGain, ctx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + fadeOutSec);
            setTimeout(() => {
                activeSources.forEach(src => {
                    try { src.stop(); } catch(e) {}
                    const idx = sound.activeSources.indexOf(src);
                    if (idx !== -1) sound.activeSources.splice(idx, 1);
                });
                gainNode.gain.setValueAtTime(currentGain, ctx.currentTime);
            }, fadeOutSec * 1000);
        } else {
            activeSources.forEach(src => {
                try { src.stop(); } catch(e) {}
                const idx = sound.activeSources.indexOf(src);
                if (idx !== -1) sound.activeSources.splice(idx, 1);
            });
        }
    }

    async function stopAllSounds() {
        for (let [filePath, sound] of soundResources.entries()) {
            await stopSound(filePath, 0);
        }
    }

    function setSoundVolume(filePath, volume) {
        const sound = soundResources.get(filePath);
        if (sound && sound.gainNode) sound.gainNode.gain.value = volume;
    }

    // ---------- UI Rendering ----------
    function renderScene(sceneIdx) {
        const scene = SCENES[sceneIdx];
        const grid = document.getElementById('soundGrid');
        if (!scene || !scene.sounds.length) {
            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:2rem; color:#aaa;">✨ No sounds for this scene. Add them in SCENES array.</div>';
            return;
        }
        grid.innerHTML = '';
        for (let s of scene.sounds) {
            const filePath = s.file;
            const card = document.createElement('div');
            card.className = 'sound-card';
            const safeName = s.name.replace(/[&<>]/g, '').replace(/\s/g, '');
            card.innerHTML = `
                <div class="sound-name">${escapeHtml(s.name)}</div>
                <div class="button-row">
                    <button class="btn btn-play" data-action="play">▶ Play</button>
                    <button class="btn btn-stop" data-action="stop">⏹ Stop</button>
                </div>
                <div class="volume-row">
                    <span>🔊 Vol</span>
                    <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
                </div>
                <div class="fade-row">
                    <button class="btn btn-fade" data-fade="in">🌊 Fade In</button>
                    <button class="btn btn-fade" data-fade="out">🌊 Fade Out</button>
                </div>
                <div class="status-text" id="status-${safeName}">⚡ ready</div>
            `;
            grid.appendChild(card);
            const playBtn = card.querySelector('.btn-play');
            const stopBtn = card.querySelector('.btn-stop');
            const volumeSlider = card.querySelector('.volume-slider');
            const fadeInBtn = card.querySelector('[data-fade="in"]');
            const fadeOutBtn = card.querySelector('[data-fade="out"]');
            const statusSpan = card.querySelector('.status-text');
            loadSound(filePath).catch(() => { statusSpan.innerText = '❌ load error'; });
            playBtn.addEventListener('click', async () => {
                statusSpan.innerText = '🎵 playing...';
                try { await playSound(filePath, 0); statusSpan.innerText = '▶ playing'; } catch(e) { statusSpan.innerText = 'error'; }
            });
            stopBtn.addEventListener('click', async () => {
                await stopSound(filePath, 0);
                statusSpan.innerText = '⏹ stopped';
                setTimeout(() => { if(statusSpan.innerText === '⏹ stopped') statusSpan.innerText = '⚡ ready'; }, 800);
            });
            volumeSlider.addEventListener('input', (e) => {
                const vol = parseFloat(e.target.value);
                setSoundVolume(filePath, vol);
                statusSpan.innerText = `🔊 ${Math.round(vol*100)}%`;
                setTimeout(() => { if(statusSpan.innerText.includes('%')) statusSpan.innerText = '⚡ ready'; }, 1000);
            });
            fadeInBtn.addEventListener('click', async () => {
                await playSound(filePath, 2);
                statusSpan.innerText = '🌊 fade in (2s)';
                setTimeout(() => statusSpan.innerText = '▶ playing', 2100);
            });
            fadeOutBtn.addEventListener('click', async () => {
                await stopSound(filePath, 2);
                statusSpan.innerText = '🌊 fade out';
                setTimeout(() => statusSpan.innerText = '⚡ ready', 2200);
            });
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function buildSceneTabs() {
        const container = document.getElementById('sceneTabs');
        container.innerHTML = '';
        SCENES.forEach((scene, idx) => {
            const btn = document.createElement('button');
            btn.textContent = scene.name;
            btn.classList.add('scene-btn');
            if (idx === currentSceneIdx) btn.classList.add('active');
            btn.addEventListener('click', () => {
                currentSceneIdx = idx;
                renderScene(idx);
                document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                stopAllSounds();
            });
            container.appendChild(btn);
        });
    }

    function setupGlobalControls() {
        const masterSlider = document.getElementById('masterVolume');
        const globalStop = document.getElementById('globalStopBtn');
        masterSlider.addEventListener('input', (e) => {
            if (masterGain) masterGain.gain.value = parseFloat(e.target.value);
        });
        globalStop.addEventListener('click', () => { stopAllSounds(); });
    }

    function resumeAudioOnFirstTouch() {
        const resumeFunc = async () => {
            if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
            document.removeEventListener('click', resumeFunc);
            document.removeEventListener('touchstart', resumeFunc);
        };
        document.addEventListener('click', resumeFunc);
        document.addEventListener('touchstart', resumeFunc);
    }

    async function init() {
        buildSceneTabs();
        setupGlobalControls();
        renderScene(0);
        resumeAudioOnFirstTouch();
        initAudio();
    }
    init();
</script>
</body>
